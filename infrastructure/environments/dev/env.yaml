# Control de Topología Híbrida
# Cambia a "true" o "false" para controlar qué módulos se despliegan

# Core Infrastructure
enable_networking: true
enable_global_lb: false
enable_hub: true
enable_argocd: true
enable_observability: false # Gestionado 100% por ArgoCD (GitOps)

# Spokes (Satélites)
enable_spoke_cloud_base: false
enable_spoke_base_hybrid: false
enable_spoke_onprem: false
enable_spoke_ai: false
enable_spoke_data: false
