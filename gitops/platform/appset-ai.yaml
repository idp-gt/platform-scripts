apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-ai-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/idp-gt/platform-scripts.git
              revision: main
              directories:
                - path: gitops/apps-ai/*
          - clusters:
              selector:
                matchLabels:
                  layer: ai
  template:
    metadata:
      name: '{{.path.basename}}-{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/idp-gt/platform-scripts.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: '{{.server}}'
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
